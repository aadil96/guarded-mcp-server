name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://meridian:meridian@localhost:5432/meridian
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Enforce MCP registration via framework
        run: pnpm check:tool-register
      - name: Enforce restricted DB access (no direct pools/drizzle outside db module)
        run: pnpm check:db-access
      - name: Migrate on real Postgres 16
        run: pnpm db:migrate
      - name: Tests on real Postgres 16 (fresh database per test file)
        run: pnpm test --reporter=verbose
      - name: Seed twice (must be idempotent)
        run: pnpm seed && pnpm seed
      - name: Verify row counts after double seed
        run: pnpm verify:seed
      - name: Smoke test the stdio server on real Postgres 16
        run: pnpm smoke "$(pnpm -s tsx -e "import {seedId} from './src/db/seed.ts'; console.log(seedId('order:4'))")"
      - name: Smoke test the HTTP server on real Postgres 16
        run: pnpm smoke:http "$(pnpm -s tsx -e "import {seedId} from './src/db/seed.ts'; console.log(seedId('invoice:3'))")"
